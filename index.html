<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TRADEVERSE — Market Lab</title>

    <link rel="stylesheet" href="Style.css">
</head>

<body>

    <!-- ================= HOME ================= -->

    <section id="home" class="home">

        <div class="top-title">
            TRADEVERSE
            <span>MARKET LAB ONLINE</span>
        </div>

        <div class="hero">

            <div class="hero-small">
                TRADEVERSE
            </div>

            <h1>
                UNDERSTAND<br>
                THE MARKET.
            </h1>

            <p>
                Learn how price moves,<br>
                one concept at a time.
            </p>

            <button id="startBtn">
                START LEARNING
                <span>→</span>
            </button>

        </div>

        <div class="home-footer">

            <div>
                MOVE YOUR MOUSE<br>
                <span>SCROLL TO EXPLORE</span>
            </div>

            <div>
                v0.1
            </div>

        </div>

    </section>


    <!-- ================= MARKET LAB ================= -->

    <section id="lab" class="lab">

        <header class="lab-header">

            <div>
                <span>MARKET LAB</span>
                <strong>01</strong>
            </div>

            <button id="backBtn">
                ← BACK
            </button>

        </header>


        <!-- ================= CANDLE ================= -->

        <div class="candle-stage">

            <div
                class="candle-scene"
                id="candleScene"
            >

                <div class="candle">

                    <!-- Colored wick -->
                    <div class="wick"></div>

                    <!-- Candle body -->
                    <div class="candle-body">

                        <div class="face front"></div>
                        <div class="face back"></div>
                        <div class="face right"></div>
                        <div class="face left"></div>
                        <div class="face top"></div>
                        <div class="face bottom"></div>

                    </div>

                    <!-- Glow -->
                    <div class="glow"></div>

                </div>

            </div>

        </div>


        <!-- ================= NOTES ================= -->

        <div class="notes-panel">

            <div class="notes-header">

                <span>01</span>

                <div>
                    <small>YOUR EXPLANATION</small>
                    <strong>CANDLESTICK</strong>
                </div>

            </div>


            <textarea
                id="lessonNotes"
                placeholder="Write your explanation here...

Example:

A candlestick shows Open,
High, Low and Close.

Explain the concept
the way you want."
            ></textarea>


            <div class="notes-footer">
                WRITE • EXPLAIN • LEARN
            </div>

        </div>


        <!-- ================= BOTTOM ================= -->

        <div class="lab-bottom">

            <div>
                <span>TRADEVERSE</span>
                <strong>CANDLESTICK LAB</strong>
            </div>

            <div class="lesson-number">
                01 <span>/</span> 05
            </div>

        </div>

    </section>


    <script src="script.js"></script>

</body>
</html>
