<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRADEVERSE — Market Lab</title>
    <link rel="stylesheet" href="Style.css">
</head>

<body>

<!-- ================= HOME ================= -->

<section id="home" class="home">

    <div class="top-title">
        TRADEVERSE
        <span>MARKET LAB ONLINE</span>
    </div>

    <div class="hero">
        <div class="hero-small">TRADEVERSE</div>

        <h1>
            UNDERSTAND<br>
            THE MARKET.
        </h1>

        <p>
            Learn how price moves,<br>
            one concept at a time.
        </p>

        <button id="startBtn">
            START LEARNING
            <span>→</span>
        </button>
    </div>

    <div class="home-footer">
        <div>
            MOVE YOUR MOUSE<br>
            <span>SCROLL TO EXPLORE</span>
        </div>

        <div>v0.1</div>
    </div>

</section>


<!-- ================= MARKET LAB ================= -->

<section id="lab" class="lab">

    <header class="lab-header">

        <div>
            <span>MARKET LAB</span>
            <strong>01</strong>
        </div>

        <button id="backBtn">
            ← BACK
        </button>

    </header>


    <!-- CANDLE AREA -->

    <div class="candle-stage">

        <!-- ================= FIXED LABELS ================= -->

        <div class="label high-label">
            <span>HIGH</span>
            <i></i>
        </div>

        <div class="label open-label">
            <span>OPEN</span>
            <i></i>
        </div>

        <div class="label close-label">
            <span>CLOSE</span>
            <i></i>
        </div>

        <div class="label low-label">
            <span>LOW</span>
            <i></i>
        </div>


        <div class="part-label upper-label">
            UPPER WICK
        </div>

        <div class="part-label body-label">
            BODY
        </div>

        <div class="part-label lower-label">
            LOWER WICK
        </div>


        <!-- ================= 3D CANDLE ================= -->

        <div class="candle-scene" id="candleScene">

            <div class="candle">

                <div class="wick"></div>

                <div class="candle-body">

                    <div class="face front"></div>
                    <div class="face back"></div>
                    <div class="face right"></div>
                    <div class="face left"></div>
                    <div class="face top"></div>
                    <div class="face bottom"></div>

                </div>

                <div class="glow"></div>

            </div>

        </div>

    </div>


    <!-- ================= BOTTOM INFO ================= -->

    <div class="lab-bottom">

        <div>
            <span>TRADEVERSE</span>
            <strong>CANDLESTICK LAB</strong>
        </div>

        <div class="lesson-number">
            01 <span>/</span> 05
        </div>

    </div>

</section>


<script src="script.js"></script>

</body>
</html>
