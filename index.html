<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>TRADEVERSE — MARKET LAB</title>

    <link
        rel="stylesheet"
        href="Style.css">
</head>

<body>

    <div class="page" id="home">

        <header>
            <div class="logo">
                TRADEVERSE
            </div>

            <div class="status">
                MARKET LAB ONLINE
            </div>
        </header>


        <main>

            <div class="small-title">
                TRADEVERSE
            </div>

            <h1>
                UNDERSTAND<br>
                THE MARKET.
            </h1>

            <p>
                Learn how price moves,
                one concept at a time.
            </p>

            <button id="startBtn">
                START LEARNING →
            </button>

        </main>


        <footer>
            <span>MOVE YOUR MOUSE</span>
            <span>SCROLL TO EXPLORE</span>
            <span>v0.1</span>
        </footer>

    </div>


    <!-- =========================
         3D LAB
    ========================= -->

    <section id="lab">

        <canvas id="space"></canvas>

        <div class="lab-ui">

            <div class="lab-top">

                <div>
                    MARKET LAB / 01
                </div>

                <button id="backBtn">
                    ← BACK
                </button>

            </div>


            <div class="lab-center">

                <div class="lesson-number">
                    LESSON 01 / 05
                </div>

                <h2>
                    CANDLESTICKS
                </h2>

                <p>
                    Explore the movement of price.
                </p>

            </div>


            <div class="lab-bottom">
                TRADEVERSE · CANDLESTICK LAB
            </div>

        </div>

    </section>


    <script src="script.js"></script>

</body>
</html>
